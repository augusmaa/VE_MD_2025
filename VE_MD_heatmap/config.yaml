# Example configuration for one three-class video dataset.
data:
  train: data/train.json
  validation: data/val.json
  frames: 5
  image_size: 224

model:
  num_classes: 3
  encoder_name: resnet50
  pretrained: true
  latent_dim: 512
  use_vit: true
  vit_dim: 1024
  use_person_pose: true
  use_face_pose: false
  two_encoders: false
  add_heatmaps: true
  projection_dim: null  # null: raw summed heatmaps; integer: projected heatmaps
  num_heatmaps_person: 18
  num_heatmaps_face: 83
  num_stages: 6
  decoder_channels: 256
  positional_encoding: sinusoidal
  feedforward_dim: 2048
  dropout: 0.0
  sample_in_eval: false
  channel_factor: 64  # used by the custom residual encoder
  blocks_res: 5

training:
  epochs: 50
  batch_size: 8  # per process with DDP
  workers: 0
  learning_rate: 1.0e-6
  weight_decay: 0.0
  grad_clip: 1.0
  seed: 2025

loss:
  person_weight: 1.0
  face_weight: 1.0
  mmd_weight: 1.0  # set to zero to disable MMD
  mmd_sigma: 1.0
